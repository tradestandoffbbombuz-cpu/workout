<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сплит-тренировки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--text:#15171c;--muted:#6b7280;--line:#e4e6eb;--acc:#e4572e;--ok:#2e9e5b;--bad:#c2410c;--chip:#fdebe5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101216;--card:#1a1d23;--text:#eef0f3;--muted:#9aa3b2;--line:#292d36;--acc:#ff7a50;--ok:#4cc07f;--bad:#ff9b6b;--chip:#3a241d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101216;--card:#1a1d23;--text:#eef0f3;--muted:#9aa3b2;--line:#292d36;--acc:#ff7a50;--ok:#4cc07f;--bad:#ff9b6b;--chip:#3a241d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:21px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.lbl{font-size:12px;color:var(--muted);margin:0 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;padding:10px 0}
button,select{font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.warn{background:var(--chip);color:var(--acc);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.day{display:flex;gap:12px;align-items:center;cursor:pointer}
.day.rest{opacity:.5;cursor:default}
.day.today{border-color:var(--acc)}
.dn{width:34px;font-weight:700}
.info{flex:1;min-width:0}.t{font-weight:600}.m{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{background:var(--chip);color:var(--acc);border-radius:99px;padding:2px 8px;font-size:12px}
.bd{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.bd.done{color:var(--ok);border-color:var(--ok)}.bd.skipped{color:var(--bad);border-color:var(--bad)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:5}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 14px calc(24px + env(safe-area-inset-bottom,0px));display:none;z-index:6;max-width:560px;margin:0 auto}
.ex{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ex .info small{color:var(--muted)}
.w{width:76px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<main>
<h1>Сплит-тренировки</h1>
<div class="card"><p class="lbl">Тренировок в неделю</p><div class="seg" id="sd"></div></div>
<div class="card"><div class="row">
<div><p class="lbl">Цель</p><select id="goal" style="width:100%"><option value="gain">Набор массы</option><option value="fat">Похудение</option><option value="keep">Поддержание</option></select></div>
<div><p class="lbl">Уровень</p><select id="lvl" style="width:100%"><option value="b">Новичок</option><option value="m">Средний</option><option value="a">Опытный</option></select></div>
</div></div>
<div id="warn"></div>
<div id="wk"></div>
</main>
<div id="ov"></div><div id="sh"></div>
<script>
var D=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
var NAME={chest:"Грудь",back:"Спина",shoulders:"Плечи",biceps:"Бицепс",triceps:"Трицепс",legs:"Ноги",glutes:"Ягодицы",abs:"Пресс",cardio:"Кардио",arms:"Руки",upper:"Верх тела",full:"Всё тело",full_light:"Всё тело",lag:"Отстающие группы"};
var SPLIT={
1:{"Пн":["full"]},
2:{"Пн":["chest","back","shoulders","biceps","triceps"],"Чт":["legs","glutes","abs","~upper"]},
3:{"Пн":["chest","biceps","abs"],"Ср":["back","triceps","shoulders"],"Пт":["legs","glutes","abs"]},
4:{"Пн":["chest","triceps"],"Вт":["back","biceps"],"Чт":["legs","abs"],"Сб":["shoulders","~lag"]},
5:{"Пн":["chest","triceps"],"Вт":["back","biceps"],"Ср":["legs","abs"],"Чт":["shoulders","~arms"],"Пт":["~full_light","cardio"]},
6:{"Пн":["chest","triceps"],"Вт":["back","biceps"],"Ср":["legs","abs"],"Чт":["chest","shoulders"],"Пт":["back","~arms"],"Сб":["legs","abs"]}
};
var IND={chest:["triceps","shoulders"],back:["biceps"],shoulders:["triceps"],legs:["glutes"],full:["chest","back","legs","shoulders","biceps","triceps","glutes","abs"]};
var EXP={arms:["biceps","triceps"],upper:["chest","back","shoulders"],lag:["shoulders","biceps","triceps"],full:["chest","back","legs","shoulders","biceps","triceps","abs"],full_light:["chest","back","legs","shoulders","abs"]};
// c = базовое, i = изолирующее, a = пресс, t = на время
var LIB={
chest:[["Жим штанги лёжа","c"],["Жим гантелей на наклонной","c"],["Разводка в кроссовере","i"],["Отжимания на брусьях","c"]],
back:[["Тяга верхнего блока","c"],["Тяга штанги в наклоне","c"],["Тяга гантели одной рукой","c"],["Гиперэкстензия","i"]],
shoulders:[["Жим гантелей сидя","c"],["Махи гантелей в стороны","i"],["Тяга к подбородку","i"],["Обратные разведения","i"]],
biceps:[["Сгибания со штангой","i"],["Молотковые сгибания","i"],["Концентрированные сгибания","i"]],
triceps:[["Французский жим","i"],["Разгибания на блоке","i"],["Жим узким хватом","c"]],
legs:[["Приседания со штангой","c"],["Жим ногами","c"],["Румынская тяга","c"],["Сгибания ног лёжа","i"],["Подъём на носки","i"]],
glutes:[["Ягодичный мост","c"],["Выпады с гантелями","c"],["Отведение ноги в кроссовере","i"]],
abs:[["Скручивания","a"],["Подъём ног в висе","a"],["Планка","t"]]
};
var PER={1:1,2:2,3:3,4:3,5:3,6:3};
var REPS={gain:{c:"6–10",i:"10–12"},fat:{c:"12–15",i:"12–15"},keep:{c:"8–12",i:"10–15"}};
var REST={gain:90,fat:45,keep:60};
var LM={b:0.7,m:1,a:1.2};
var S={days:3,goal:"gain",lvl:"b",map:{},st:{},w:{}};
var open=null;

function load(){try{var r=localStorage.getItem("splitapp1");if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
var tg=window.Telegram&&window.Telegram.WebApp;
function save(){
var j=JSON.stringify(S);
try{localStorage.setItem("splitapp1",j);}catch(e){}
try{if(tg&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")&&j.length<4000)tg.CloudStorage.setItem("splitapp1",j);}catch(e){}
}
function wid(){var n=new Date();n.setDate(n.getDate()-((n.getDay()+6)%7));return n.toISOString().slice(0,10);}
function today(){return (new Date().getDay()+6)%7;}

function plan(){var out={};var sp=SPLIT[S.days];Object.keys(sp).forEach(function(o){out[S.map[o]||o]={orig:o,keys:sp[o]};});return out;}
function exs(keys){
var list=[],n=PER[S.days];
keys.forEach(function(k){
var light=k.charAt(0)==="~";if(light)k=k.slice(1);
if(k==="cardio"){list.push({n:"Кардио",s:1,r:"20–30 мин",kind:"x"});return;}
var parts=EXP[k]||[k],per=light?1:((k==="full")?(S.days===1?2:1):n);
if(EXP[k]&&!light&&k!=="full")per=1;
parts.forEach(function(p){
var pp=per;if(k==="full"&&S.days===1&&["biceps","triceps","shoulders","abs"].indexOf(p)>=0)pp=1;
(LIB[p]||[]).slice(0,pp).forEach(function(e,i){
var kind=e[1],s=kind==="c"?(S.goal==="gain"?4:3):3;
s=Math.max(2,Math.round(s*LM[S.lvl]));
var r=kind==="a"?"12–20":kind==="t"?"40–60 с":REPS[S.goal][kind];
list.push({n:e[0],s:s,r:r,kind:kind});
});});
});
return list;
}
function mins(list){var t=0;list.forEach(function(e){t+=e.kind==="x"?25:e.s*(0.75+REST[S.goal]/60)+1;});return Math.round(t/5)*5;}
function label(keys){var seen={},o=[];keys.forEach(function(k){k=k.replace("~","");var l=NAME[k];if(!seen[l]){seen[l]=1;o.push(l);}});return o;}
function heavy(keys){var s={};keys.forEach(function(k){if(k.charAt(0)==="~"||k==="full_light"||k==="cardio")return;s[k]=1;(IND[k]||[]).forEach(function(m){s[m]=1;});});return s;}
function prim(keys){var o=[];keys.forEach(function(k){if(k.charAt(0)==="~"||k==="full_light"||k==="cardio")return;if(k==="full")o=o.concat(EXP.full);else o.push(k);});return o;}
function warns(p){
var w=[];
D.forEach(function(d,i){var pd=D[(i+6)%7];if(!p[d]||!p[pd]||S.days===1)return;
var h=heavy(p[pd].keys);var c=prim(p[d].keys).filter(function(m){return h[m];});
if(c.length)w.push(pd+" → "+d+": "+c.map(function(m){return NAME[m];}).join(", "));});
return w;
}
function stat(d){var k=wid()+d;if(S.st[k])return S.st[k];return D.indexOf(d)<today()?"skipped":"upcoming";}
var ST={upcoming:"Предстоит",done:"Выполнена",skipped:"Пропущена"};

function render(){
var p=plan(),h="";
D.forEach(function(d,i){
var x=p[d];
if(!x){h+='<div class="card day rest"><div class="dn">'+d+'</div><div class="info"><div class="t">Отдых</div></div></div>';return;}
var l=exs(x.keys),s=stat(d);
h+='<div class="card day'+(i===today()?" today":"")+'" data-d="'+d+'"><div class="dn">'+d+'</div><div class="info"><div class="t">'+label(x.keys).join(", ")+'</div>'
+'<div class="m">'+l.length+' упр. · ≈ '+mins(l)+' мин</div></div><span class="bd '+s+'">'+ST[s]+'</span></div>';
});
wk.innerHTML=h;
var w=warns(p);
warn.innerHTML=w.length?'<div class="warn"><b>Мало времени на восстановление</b><br>'+w.join("<br>")+'<br>Лучше разнести эти дни.</div>':"";
var b="";for(var i=1;i<=6;i++)b+='<button data-n="'+i+'" class="'+(S.days===i?"on":"")+'">'+i+'</button>';
sd.innerHTML=b;goal.value=S.goal;lvl.value=S.lvl;
}
function sheet(d){
open=d;var x=plan()[d],l=exs(x.keys),s=stat(d);
var free=D.filter(function(z){return !plan()[z]||z===d;});
var h='<h2 style="margin:0 0 2px">'+d+": "+label(x.keys).join(", ")+'</h2><div class="m">'+l.length+' упр. · ≈ '+mins(l)+' мин · отдых '+REST[S.goal]+' с</div>'
+'<div class="seg" style="margin:12px 0"><button data-s="done" class="'+(s==="done"?"on":"")+'">Выполнена</button><button data-s="skipped" class="'+(s==="skipped"?"on":"")+'">Пропущена</button><button data-s="upcoming">Сбросить</button></div>'
+'<p class="lbl">Перенести на другой день</p><div class="seg" style="margin-bottom:8px">'+free.map(function(z){return '<button data-mv="'+z+'" class="'+(z===d?"on":"")+'">'+z+'</button>';}).join("")+'</div>';
l.forEach(function(e){
h+='<div class="ex"><div class="info"><b>'+e.n+'</b><br><small>'+(e.kind==="x"?e.r:e.s+" × "+e.r)+'</small></div>'
+(e.kind==="x"?"":'<input class="w" type="number" inputmode="decimal" placeholder="кг" data-w="'+e.n+'" value="'+(S.w[e.n]||"")+'">')+'</div>';
});
sh.innerHTML=h;sh.style.display=ov.style.display="block";
}
function close(){open=null;sh.style.display=ov.style.display="none";}

wk.onclick=function(e){var c=e.target.closest(".day[data-d]");if(c)sheet(c.getAttribute("data-d"));};
ov.onclick=close;
sh.onclick=function(e){
var t=e.target,s=t.getAttribute("data-s"),m=t.getAttribute("data-mv");
if(s){S.st[wid()+open]=s==="upcoming"?"":s;if(!s||s==="upcoming")delete S.st[wid()+open];save();render();sheet(open);}
if(m&&m!==open){var o=plan()[open].orig;S.map[o]=m;delete S.st[wid()+open];save();render();sheet(m);}
};
sh.oninput=function(e){var k=e.target.getAttribute("data-w");if(k){S.w[k]=e.target.value;save();}};
sd.onclick=function(e){var n=e.target.getAttribute("data-n");if(n){S.days=+n;S.map={};save();render();}};
goal.onchange=function(){S.goal=goal.value;save();render();};
lvl.onchange=function(){S.lvl=lvl.value;save();render();};
load();render();
if(tg){
try{
tg.ready();tg.expand();
var tp=tg.themeParams||{},rs=document.documentElement.style;
if(tp.secondary_bg_color||tp.bg_color)rs.setProperty("--bg",tp.secondary_bg_color||tp.bg_color);
if(tp.bg_color)rs.setProperty("--card",tp.bg_color);
if(tp.text_color)rs.setProperty("--text",tp.text_color);
if(tp.hint_color)rs.setProperty("--muted",tp.hint_color);
if(tp.button_color)rs.setProperty("--acc",tp.button_color);
}catch(e){}
try{
if(tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")){
tg.CloudStorage.getItem("splitapp1",function(err,v){
if(!err&&v){try{S=Object.assign(S,JSON.parse(v));render();}catch(e){}}
});
}
}catch(e){}
}
</script>
</body>
</html>
